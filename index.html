<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>진로 특기 초안</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #5f6b7a;
      --line: #dde2e8;
      --accent: #0f766e;      /* 강조색 한 가지 */
      --accent-soft: #e6f4f2;
      --error-bg: #fdecec;
      --error-text: #a12626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 18px; line-height: 1.6;
    }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 28px; margin: 0 0 4px; }
    h2 { font-size: 21px; margin: 0 0 12px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 20px; margin-bottom: 20px;
    }
    .hint { color: var(--muted); font-size: 16px; margin: 0 0 12px; }
    textarea, input[type=number] {
      width: 100%; font: inherit; color: inherit; padding: 12px;
      border: 1px solid var(--line); border-radius: 10px; background: #fff;
    }
    textarea:focus, input:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
    button {
      min-height: 48px; min-width: 48px; padding: 0 20px; font: inherit; font-weight: 600;
      border-radius: 10px; border: 1px solid var(--accent); cursor: pointer;
      background: #fff; color: var(--accent);
    }
    button.main { background: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: wait; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .num-box { display: flex; gap: 8px; align-items: center; }
    .num-box input { width: 100px; text-align: center; font-size: 22px; font-weight: 700; }
    .checks { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); margin: 4px 0 16px; }
    .check {
      display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px;
      border: 1px solid var(--line); border-radius: 10px; cursor: pointer; user-select: none;
    }
    .check input { width: 26px; height: 26px; accent-color: var(--accent); flex: none; }
    .check.on { border-color: var(--accent); background: var(--accent-soft); }
    .answers { border-left: 4px solid var(--accent); padding: 4px 0 4px 14px; margin: 12px 0 16px; }
    .answers dt { font-weight: 700; font-size: 16px; color: var(--muted); }
    .answers dd { margin: 0 0 10px; white-space: pre-wrap; word-break: break-word; }
    .count { color: var(--muted); font-size: 15px; text-align: right; margin-top: 4px; }
    .msg { padding: 14px 16px; border-radius: 10px; margin-bottom: 20px; display: none; }
    .msg.ok { display: block; background: var(--accent-soft); color: var(--accent); }
    .msg.err { display: block; background: var(--error-bg); color: var(--error-text); }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 15px; }
    th, td { border: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
    th { background: var(--bg); }
    .tag { display: inline-block; font-size: 14px; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 0 8px; margin-left: 6px; }
    .empty { color: var(--muted); }
    @media (max-width: 480px) {
      body { font-size: 17px; }
      .row button { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
<main>
  <h1>진로 특기 초안</h1>
  <p class="sub">번호를 고르고 폼 답을 불러와, 체크와 초안을 적은 뒤 [제출]을 눌러 주세요.</p>

  <div id="msg" class="msg" role="status" aria-live="polite"></div>

  <!-- 시트가 비어 있을 때만 보이는 예시 -->
  <section id="exampleCard" class="card" hidden>
    <h2>기록 시트는 이런 모양으로 쌓여요 <span class="tag">예시</span></h2>
    <p class="hint">아직 기록이 없어서 예시 3줄을 보여 드려요. 실제 시트에는 저장되지 않아요.</p>
    <div class="table-wrap"><table id="exampleTable"></table></div>
  </section>

  <!-- 1. 체크 항목 만들기 -->
  <section class="card">
    <h2>1. 체크 항목 만들기</h2>
    <p class="hint">초안에 넣을 요소를 한 줄에 하나씩 적어 주세요. (예: 진로 희망, 탐색 활동, 느낀 점)</p>
    <textarea id="itemsInput" rows="4" placeholder="진로 희망&#10;탐색 활동&#10;느낀 점"></textarea>
    <div class="row"><button id="saveItemsBtn" type="button">항목 저장</button></div>
  </section>

  <!-- 2. 학생 기록 -->
  <section class="card">
    <h2>2. 학생 기록</h2>
    <label for="numInput" class="hint" style="display:block">학생 번호</label>
    <div class="row" style="margin-top:0">
      <div class="num-box">
        <button type="button" id="minusBtn" aria-label="번호 하나 줄이기">−</button>
        <input type="number" id="numInput" min="1" max="99" inputmode="numeric" value="1">
        <button type="button" id="plusBtn" aria-label="번호 하나 늘리기">+</button>
      </div>
      <button type="button" id="loadBtn">폼 답 불러오기</button>
    </div>

    <div id="answerBox"></div>

    <h2 style="margin-top:20px">체크 표</h2>
    <div id="checkArea" class="checks"></div>

    <label for="draftInput" class="hint" style="display:block">진로활동 특기사항 초안</label>
    <textarea id="draftInput" rows="7" placeholder="폼 답을 보고 핵심을 요약해 적어 주세요."></textarea>
    <div class="count" id="count">0자</div>

    <div class="row"><button id="submitBtn" type="button" class="main">제출</button></div>
  </section>

  <!-- 3. 내려받기 -->
  <section class="card">
    <h2>3. 엑셀로 내려받기</h2>
    <p class="hint">지금까지 저장한 기록을 .xlsx 파일로 저장해요.</p>
    <div class="row"><button id="downloadBtn" type="button">내려받기</button></div>
  </section>
</main>

<script>
  var state = { items: [], columns: [] };
  var $ = function (id) { return document.getElementById(id); };

  // ---- 안내 문구 ----
  function show(text, isError) {
    var box = $('msg');
    box.textContent = text;
    box.className = 'msg ' + (isError ? 'err' : 'ok');
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function errText(e) {
    var t = (e && e.message) ? e.message : String(e || '');
    t = t.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '');
    if (!t || /ScriptError|authoriz|권한/i.test(t)) {
      return '문제가 생겼어요. 화면을 새로 고친 뒤 다시 해 주세요. (' + (t || '알 수 없는 오류') + ')';
    }
    return t;
  }
  window.onerror = function (m) { show('화면에서 문제가 생겼어요. 새로 고침해 주세요. (' + m + ')', true); };

  // ---- 서버 호출 공통 ----
  function call(fn, arg, btn, onOk) {
    if (!window.google || !google.script || !google.script.run) {
      show('이 파일은 Apps Script 웹 앱 주소로 열어야 동작해요.', true);
      return;
    }
    if (btn) btn.disabled = true;
    var runner = google.script.run
      .withSuccessHandler(function (res) { if (btn) btn.disabled = false; onOk(res); })
      .withFailureHandler(function (e) { if (btn) btn.disabled = false; show(errText(e), true); });
    if (arg === undefined) runner[fn](); else runner[fn](arg);
  }

  // ---- 예시 표 ----
  function renderExamples(columns, rows) {
    var html = '<tr>' + columns.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>';
    rows.forEach(function (r) {
      html += '<tr>' + r.map(function (v) { return '<td>' + esc(v) + '</td>'; }).join('') + '</tr>';
    });
    $('exampleTable').innerHTML = html;
    $('exampleCard').hidden = false;
  }

  // ---- 체크 표 ----
  function renderChecks() {
    var area = $('checkArea');
    area.innerHTML = '';
    if (state.items.length === 0) {
      area.innerHTML = '<p class="empty">위 1번에서 항목을 적고 [항목 저장]을 눌러 주세요.</p>';
      return;
    }
    state.items.forEach(function (item, i) {
      var label = document.createElement('label');
      label.className = 'check';
      label.innerHTML = '<input type="checkbox" data-i="' + i + '"><span>' + esc(item) + '</span>';
      label.querySelector('input').addEventListener('change', function () {
        label.classList.toggle('on', this.checked);
      });
      area.appendChild(label);
    });
  }

  // ---- 폼 답 표시 ----
  function renderAnswers(res, num) {
    var box = $('answerBox');
    if (!res.found) {
      box.innerHTML = '<p class="empty" style="margin-top:12px">' + num + '번 학생의 폼 응답이 없어요. 번호를 다시 확인해 주세요.</p>';
      return;
    }
    if (res.answers.length === 0) {
      box.innerHTML = '<p class="empty" style="margin-top:12px">' + num + '번 응답은 있지만 보여 줄 답이 비어 있어요.</p>';
      return;
    }
    box.innerHTML = '<dl class="answers">' + res.answers.map(function (x) {
      return '<dt>' + esc(x.q) + '</dt><dd>' + esc(x.a) + '</dd>';
    }).join('') + '</dl>';
  }

  function esc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function getNum() { return parseInt($('numInput').value, 10); }

  // ---- 버튼 연결 ----
  $('minusBtn').onclick = function () { var n = getNum() || 1; $('numInput').value = Math.max(1, n - 1); $('answerBox').innerHTML = ''; };
  $('plusBtn').onclick = function () { var n = getNum() || 0; $('numInput').value = Math.min(99, n + 1); $('answerBox').innerHTML = ''; };
  $('numInput').oninput = function () { $('answerBox').innerHTML = ''; };
  $('draftInput').oninput = function () { $('count').textContent = this.value.length + '자'; };

  $('saveItemsBtn').onclick = function () {
    var list = $('itemsInput').value.split('\n').map(function (t) { return t.trim(); }).filter(Boolean);
    if (list.length === 0) { show('항목을 한 줄에 하나씩 적어 주세요.', true); return; }
    call('saveItems', list, this, function (saved) {
      state.items = saved;
      renderChecks();
      show('항목 ' + saved.length + '개를 저장했어요. 체크 표에 ' + saved.length + '칸이 생겼어요.');
    });
  };

  $('loadBtn').onclick = function () {
    var num = getNum();
    if (!num || num < 1 || num > 99) { show('번호는 1부터 99 사이 숫자로 적어 주세요.', true); return; }
    call('loadFormAnswers', num, this, function (res) {
      renderAnswers(res, num);
      $('msg').className = 'msg';
    });
  };

  $('submitBtn').onclick = function () {
    var num = getNum();
    if (!num || num < 1 || num > 99) { show('번호는 1부터 99 사이 숫자로 적어 주세요.', true); return; }
    var checks = Array.prototype.map.call(document.querySelectorAll('#checkArea input'), function (box) {
      return { item: state.items[+box.dataset.i], done: box.checked };
    });
    var draft = $('draftInput').value.trim();
    if (!draft && checks.length === 0) { show('체크하거나 초안을 적은 뒤 제출해 주세요.', true); return; }
    call('saveRecord', { number: num, checks: checks, draft: draft }, this, function (res) {
      show(num + '번 기록을 시트 ' + res.row + '번째 줄에 저장했어요.');
      $('draftInput').value = '';
      $('count').textContent = '0자';
      renderChecks();
      $('exampleCard').hidden = true;
    });
  };

  $('downloadBtn').onclick = function () {
    call('downloadXlsx', undefined, this, function (res) {
      var bin = atob(res.base64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = res.name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      show(res.name + ' 파일을 내려받았어요.');
    });
  };

  // ---- 첫 화면 불러오기 ----
  renderChecks();
  call('getStart', undefined, null, function (res) {
    state.items = res.items;
    state.columns = res.columns;
    $('itemsInput').value = res.items.join('\n');
    renderChecks();
    if (res.isEmpty) renderExamples(res.columns, res.examples);
  });
</script>
</body>
</html>
